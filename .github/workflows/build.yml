name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: |
          unzip -oq AutoFish-Macro-Maker*.zip -d unpacked
          echo "PROJ=$(dirname "$(find unpacked -name settings.gradle.kts | head -n 1)")" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p "$PROJ" assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AutoFish-Macro-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/app-debug.apk
